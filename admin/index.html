<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Panel - Web Kelas</title>
  <!-- Script Decap CMS dari CDN -->
  <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
  
  <!-- Custom CSS untuk mempercantik tampilan jadi Full Screen & Modern -->
  <style>
    /* Reset dasar agar memenuhi layar penuh */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    html, body {
      width: 100%;
      height: 100vh;
      overflow: hidden;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
      color: #f8fafc;
    }

    /* Efek loading atau container awal sebelum CMS termuat */
    #nc-root {
      width: 100%;
      height: 100%;
    }
  </style>
</head>
<body>
  <!-- Root elemen tempat Decap CMS merender dashboard-nya secara otomatis -->
  <div id="nc-root"></div>

  <!-- Include script Decap CMS -->
  <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>
  
  <script>
    if (window.netlifyIdentity) {
      window.netlifyIdentity.on("init", user => {
        if (!user) {
          window.netlifyIdentity.on("login", () => {
            document.location.reload();
          });
        }
      });
    }
  </script>
</body>
</html>
